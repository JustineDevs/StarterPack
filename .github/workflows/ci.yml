name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter-pack/package-lock.json
      - name: Install dependencies
        working-directory: ./starter-pack
        run: npm ci
      - name: Run linter
        working-directory: ./starter-pack
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter-pack/package-lock.json
      - name: Install dependencies
        working-directory: ./starter-pack
        run: npm ci
      - name: Run type check
        working-directory: ./starter-pack
        run: npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter-pack/package-lock.json
      - name: Install dependencies
        working-directory: ./starter-pack
        run: npm ci
      - name: Run tests
        working-directory: ./starter-pack
        run: npm test -- --coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: starter-pack/package-lock.json
      - name: Install dependencies
        working-directory: ./starter-pack
        run: npm ci
      - name: Build project
        working-directory: ./starter-pack
        run: npm run build

